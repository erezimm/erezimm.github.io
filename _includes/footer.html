<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-links">
      {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
      {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
      {% if site.author.orcid %}<a href="https://orcid.org/{{ site.author.orcid }}" target="_blank" rel="noopener">ORCID</a>{% endif %}
      {% if site.author.ads %}<a href="{{ site.author.ads }}" target="_blank" rel="noopener">ADS</a>{% endif %}
      {% if site.author.scholar %}<a href="https://scholar.google.com/citations?user={{ site.author.scholar }}" target="_blank" rel="noopener">Scholar</a>{% endif %}
    </div>
    <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
  </div>
</footer>
